<<!DOCTYPE html>
<html lang="es">
<head>
  <!-- ================= CONFIGURACIÓN GENERAL ================= -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Historia 💖</title>

  <!-- ================= FUENTES ================= -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- ================= ESTILOS ================= -->
  <style>
    /* ===== ESTILO GENERAL ===== */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #ff9a9e, #fad0c4);
      height: 100vh;
      overflow: hidden;
    }

    /* ===== CONTENEDOR PRINCIPAL ===== */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    /* ===== TARJETA ===== */
    .card {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      box-shadow: 0 25px 50px rgba(255,105,135,0.35);
      padding: 45px 35px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: aparecer 1s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    h1, h2 {
      font-family: 'Great Vibes', cursive;
      color: #ff4f81;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 18px 0;
    }

    /* ===== BOTÓN ===== */
    button {
      margin-top: 25px;
      padding: 14px 35px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(135deg, #ff4f81, #ff85a2);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255,79,129,0.4);
    }

    button:hover {
      transform: scale(1.05);
    }

    /* ===== CONFETI DE CORAZONES ===== */
    .heart {
      position: fixed;
      top: -10px;
      color: rgba(255,79,129,0.7);
      font-size: 20px;
      animation: caer linear forwards;
    }

    @keyframes caer {
      to { transform: translateY(110vh); opacity: 0; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .card { padding: 35px 25px; }
      p { font-size: 1rem; }
    }
  </style>
</head>

<body>

<!-- ================= AUDIO (SUENA CON CLICK) ================= -->
<audio id="musica" loop>
  <source src="Morat, Juanes-Besos en Guerra.mp3" type="audio/mpeg">
</audio>

<!-- ================= CONTENIDO ================= -->
<div class="container">
  <div class="card" id="contenido"></div>
</div>

<!-- ================= JAVASCRIPT ================= -->
<script>

  /* ===== CONTROL DE AUDIO ===== */
  const musica = document.getElementById('musica');

  /* ===== HISTORIA (ORDENADA) ===== */
  const historia = [
    `<h1>Nuestra Historia 💖</h1>
     <p>Este 14 de febrero quiero que recorras conmigo nuestra historia, paso a paso, con el corazón abierto.</p>
     <button onclick="siguiente()">Comenzar</button>`,

    `<h2>Septiembre 2025</h2>
     <p>Tres años en el mismo colegio, sin hablarnos jamás… hasta que el destino decidió sentarnos en el mismo camino llamado BTP.</p>
     <img src="primera-foto.jpeg" style="width:100%; border-radius:15px; margin-top:15px;">
     <button onclick="siguiente()">Siguiente</button>`,

    `<h2>El inicio real</h2>
     <p>Desde el primer día hubo algo especial. Conversaciones, risas, miradas… una química imposible de ignorar.</p>
     <button onclick="siguiente()">Siguiente</button>`,

    `<h2>Primera cita 🍨</h2>
     <p>Helados, sonrisas y un momento simple que se volvió inolvidable. Ahí confirmé que me encantabas.</p>
     <img src="Foto-recuerdo.jpeg" style="width:100%; border-radius:15px; margin-top:15px;">
     <button onclick="siguiente()">Siguiente</button>`,

    `<h2>1 de enero</h2>
     <p style="text-align:center">Me colé en tu casa como un ladrón de minutos para robarle al año nuestro primer abrazo. Entre el miedo y las ganas de no soltarte, amanecimos estrenando calendario y nuestra historia.</p>
     <button onclick="siguiente()">Siguiente</button>`,

    `<h2>Y entonces entendí algo…</h2>
     <p>Amarte no es solo recordar nuestra historia, es elegirte todos los días.</p>
     <button onclick="mostrarRazones()">Ver las razones</button>`
  ];

  /* ===== 100 RAZONES ===== */
  const razones = Array.from({length:100}, (_,i)=>`<h2>Razón ${i+1}</h2><p>${i===99 ? 'Por ser tú misma, KATHERINE LISSETH NIETO ALVAREZ, la razón de mis alegrías 💖' : 'Porque haces mi vida más bonita de una manera única.'}</p><button onclick="siguienteRazon()">Siguiente</button>`);

  let index = 0;
  let razonIndex = 0;

  function iniciar() {
    document.getElementById('contenido').innerHTML = historia[0];
  }

  function siguiente() {
    if (musica.paused) musica.play();
    index++;
    document.getElementById('contenido').innerHTML = historia[index];
    lanzarCorazones();
  }

  function mostrarRazones() {
    document.getElementById('contenido').innerHTML = razones[0];
  }

  function siguienteRazon() {
    razonIndex++;
    if (razonIndex < razones.length) {
      document.getElementById('contenido').innerHTML = razones[razonIndex];
      lanzarCorazones();
    } else {
      document.getElementById('contenido').innerHTML = `<h2>¿Quieres seguir escribiendo esta historia conmigo? 💕</h2><button>Me quedo</button> <button>Me voy</button>`;
    }
  }

  /* ===== CONFETI ===== */
  function lanzarCorazones() {
    for (let i = 0; i < 10; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.innerHTML = '💖';
      h.style.left = Math.random() * 100 + 'vw';
      h.style.animationDuration = (Math.random() * 3 + 3) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 6000);
    }
  }

  iniciar();
</script>

</body>
</html>
