function siguiente(){

indiceHistoria++;
contenido.innerHTML=historia[indiceHistoria];

function mostrarRazones(){
indiceRazon=0;
renderRazon();
}

function siguienteRazon(){
indiceRazon++;
if(indiceRazon<razones.length){
  renderRazon();
}else{
  mostrarDecision();
}
}

function renderRazon(){
  
document.getElementById("progreso").style.width =
((indiceRazon+1)/razones.length)*100 + "%";


cambiarFondo();  // 👈 AQUÍ

let r = razones[indiceRazon];

contenido.innerHTML=`
<h2>${r.titulo}</h2>
<p>${r.texto}</p>
<button onclick="siguienteRazon()">Siguiente</button>`;
}

/* ===== DECISIÓN FINAL ===== */
function mostrarDecision(){
contenido.innerHTML=`
<h2>¿Quieres seguir escribiendo esta historia conmigo? 💕</h2>
<button onclick="respuesta('Se queda ❤️')">Me quedo</button>
<button onclick="respuesta('Se va 💔')">Me voy</button>`;
}

function respuesta(valor){
guardarRespuesta(valor);

if(valor==="Se queda ❤️"){
contenido.innerHTML=`
<h2>Sabía que dirías que sí 💖</h2>
<p>Prometo seguir construyendo contigo una historia que ni el tiempo pueda borrar.</p>`;
}else{
contenido.innerHTML=`
<h2>Siempre te voy a amar 💔</h2>
<p>Gracias por cada momento, cada risa y cada recuerdo que guardo en mi corazón.</p>`;
}
}

/* ===== CONFETI OPTIMIZADO ===== */
function crearCorazon(){
const heart=document.createElement("div");
heart.className="heart";
heart.innerText="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(Math.random()*3+4)+"s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),7000);
}

setInterval(crearCorazon,800); // velocidad controlada
function cambiarFondo(){
  if(indiceRazon<=25)
    document.body.style.background="linear-gradient(135deg,#ff9a9e,#fad0c4)";
  else if(indiceRazon<=50)
    document.body.style.background="linear-gradient(135deg,#a18cd1,#fbc2eb)";
  else if(indiceRazon<=75)
    document.body.style.background="linear-gradient(135deg,#ff758c,#ff7eb3)";
  else
    document.body.style.background="linear-gradient(135deg,#f6d365,#fda085)";
}

setInterval(crearCorazon,800);

contenido.innerHTML=historia[0];
