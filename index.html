<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Historia 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(180deg, #ff9a9e, #fad0c4);
  overflow-x: hidden;
}

/* CONTENEDOR */
.card {
  background: white;
  max-width: 90%;
  margin: 50px auto;
  padding: 30px;
  border-radius: 25px;
  box-shadow: 0 15px 40px rgba(0,0,0,.2);
  text-align: center;
}

/* TITULOS */
h1 {
  font-family: 'Great Vibes', cursive;
  color: #ff4f81;
  font-size: 3rem;
}

p {
  font-size: 1.05rem;
  line-height: 1.7;
}

/* BOTONES */
button {
  background: #ff4f81;
  color: white;
  border: none;
  padding: 15px 30px;
  border-radius: 30px;
  font-size: 1rem;
  cursor: pointer;
  margin-top: 25px;
}

button:hover {
  transform: scale(1.05);
}

/* IMAGEN */
img {
  width: 100%;
  border-radius: 20px;
  margin-top: 20px;
  display: none;
}

/* CONFETI */
.heart {
  position: fixed;
  top: -10px;
  font-size: 20px;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
    opacity: 0;
  }
}

/* OCULTAR */
.hidden {
  display: none;
}
</style>
</head>

<body>

<!-- MUSICA -->
<audio id="musica" loop>
  <source src="Morat, Juanes-Besos en Guerra.mp3" type="audio/mpeg">
</audio>

<!-- INTRO -->
<div class="card" id="intro">
  <h1>Nuestra Historia 💖</h1>
  <p>
    Este 14 de febrero quiero que recorras conmigo nuestra historia…  
    paso a paso, sin prisas, con el corazón abierto.
  </p>
  <button onclick="comenzar()">Comenzar</button>
</div>

<!-- CONTENIDO -->
<div class="card hidden" id="contenido">
  <p id="texto"></p>
  <img id="imagen">
  <button onclick="siguiente()">Siguiente</button>
</div>

<script>
/* ===== VARIABLES ===== */
let paso = 0;

/* ===== HISTORIA ===== */
const historia = [
  {
    texto: "Tres años en el mismo colegio. Mismos pasillos, mismas miradas cruzadas, mismas rutinas… y aun así, sin hablarnos jamás. El destino nos estaba guardando.",
    img: null
  },
  {
    texto: "Septiembre de 2025. Entramos al BTP y empezamos a hablar. Desde el primer día algo se sintió distinto, una conexión real, intensa, imposible de ignorar.",
    img: "primera-foto.jpeg"
  },
  {
    texto: "Te conté mi verdad, incluso las partes más oscuras. No huiste. No juzgaste. Me abrazaste con palabras y decidiste quedarte.",
    img: null
  },
  {
    texto: "Nuestra primera cita fue simple: unos helados, risas nerviosas y la certeza de que contigo todo se sentía correcto.",
    img: "Foto-recuerdo.jpeg"
  },
  {
    texto: "Me colé en tu casa como un ladrón de minutos para robarle al año nuestro primer abrazo. Entre el miedo y las ganas, despertamos estrenando calendario y nuestra historia.",
    img: null
  },
  {
    texto: "Desde ese día entendí que el amor no es perfecto, pero sí valiente. Y tú eres la valentía más bonita que conozco.",
    img: null
  }
];

/* ===== 100 RAZONES ===== */
for (let i = 1; i <= 99; i++) {
  historia.push({
    texto: "Razón " + i + ": Porque incluso sin darte cuenta, haces que mi mundo sea un lugar más seguro y bonito.",
    img: null
  });
}

historia.push({
  texto: "Razón 100: Por ser tú misma, KATHERINE LISSETH NIETO ALVAREZ, la razón de mis alegrías, de mi calma y de mi amor más sincero.",
  img: null
});

/* FINAL */
historia.push({
  texto: "¿Quieres seguir escribiendo esta historia conmigo? 💖",
  img: null,
  final: true
});

/* ===== FUNCIONES ===== */
function comenzar() {
  document.getElementById("intro").classList.add("hidden");
  document.getElementById("contenido").classList.remove("hidden");
  reproducirMusica();
  lanzarCorazones();
  mostrarPaso();
}

function mostrarPaso() {
  const texto = document.getElementById("texto");
  const imagen = document.getElementById("imagen");
  const boton = document.querySelector("#contenido button");

  texto.innerText = historia[paso].texto;

  if (historia[paso].img) {
    imagen.src = historia[paso].img;
    imagen.style.display = "block";
  } else {
    imagen.style.display = "none";
  }

  if (historia[paso].final) {
    boton.style.display = "none";
    texto.innerHTML += `
      <br><br>
      <button onclick="respuesta(true)">Me quedo 💕</button>
      <button onclick="respuesta(false)">Me voy 💔</button>
    `;
  }
}

function siguiente() {
  paso++;
  mostrarPaso();
}

function reproducirMusica() {
  const musica = document.getElementById("musica");
  musica.volume = 0.5;
  musica.play();
}

function lanzarCorazones() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💕";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }, 300);
}

function respuesta(seQueda) {
  document.getElementById("texto").innerText = seQueda
    ? "Gracias por quedarte. Prometo amarte bonito, incluso en los días difíciles 💖"
    : "Aunque duela, siempre agradeceré haberte amado 💔";
}
</script>

</body>
</html>
