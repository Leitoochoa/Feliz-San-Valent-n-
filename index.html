<!DOCTYPE html>
<html lang="es">
<head>
  <!-- =========================
       CONFIGURACIÓN BÁSICA
  ========================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz 14 de Febrero ❤️</title>

  <!-- =========================
       FUENTES
  ========================== -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- =========================
       ESTILOS (DISEÑO)
  ========================== -->
  <style>
    body{
      margin:0;
      font-family:'Poppins',sans-serif;
      background:linear-gradient(180deg,#ff758c,#ff7eb3);
      color:#333;
      overflow-x:hidden;
    }

    header{
      text-align:center;
      padding:80px 20px;
      color:white;
    }

    header h1{
      font-family:'Great Vibes',cursive;
      font-size:3.8rem;
    }

    .container{
      max-width:800px;
      margin:auto;
      padding:20px;
    }

    .event{
      background:white;
      border-radius:20px;
      padding:30px;
      margin:40px 0;
      box-shadow:0 15px 30px rgba(0,0,0,.2);
      animation:fade .8s ease;
    }

    .event img{
      width:100%;
      border-radius:15px;
      margin-top:20px;
    }

    button{
      display:block;
      margin:40px auto;
      padding:15px 40px;
      border:none;
      border-radius:30px;
      background:#ff4f81;
      color:white;
      font-size:1.1rem;
      cursor:pointer;
    }

    /* Corazones flotando */
    .heart{
      position:fixed;
      bottom:-20px;
      font-size:20px;
      animation:float 6s linear infinite;
      opacity:.8;
    }

    @keyframes float{
      from{transform:translateY(0);opacity:.8}
      to{transform:translateY(-120vh);opacity:0}
    }

    @keyframes fade{
      from{opacity:0;transform:translateY(20px)}
      to{opacity:1;transform:translateY(0)}
    }
  </style>
</head>
<body>

  <!-- =========================
       AUDIO (MÚSICA)
       ⚠️ Suena SOLO con click
  ========================== -->
  <audio id="musica" preload="auto">
    <source src="Morat, Juanes-Besos en Guerra.mp3.mp3" type="audio/mpeg">
  </audio>

  <!-- =========================
       ENCABEZADO
  ========================== -->
  <header>
    <h1>Feliz 14 de Febrero ❤️</h1>
    <p>Una historia escrita con amor, solo para ti</p>
  </header>

  <!-- =========================
       CONTENIDO INTERACTIVO
  ========================== -->
  <div class="container" id="historia"></div>

  <button id="btn" onclick="avanzar()">💖 Comenzar nuestra historia</button>

  <!-- =========================
       JAVASCRIPT (INTERACCIÓN)
  ========================== -->
  <script>
    /* ---------- VARIABLES ---------- */
    const musica = document.getElementById('musica');
    let musicaIniciada = false;
    let paso = 0;

    /* ---------- HISTORIA ---------- */
    const momentos = [
      'Esta página no es solo un regalo… es una parte de mi corazón hecha palabras, pensada para ti ❤️',

      'Durante tres años caminamos por los mismos pasillos sin hablarnos, sin saber que el destino nos estaba preparando este encuentro.',

      'En septiembre de 2025 todo cambió. Entramos al BTP y desde el primer día sentí algo especial contigo.',

      '<p>Esta foto guarda el inicio de algo hermoso.</p><img src="primera-foto.jpeg">',

      'Nuestra primera cita fue sencilla, pero perfecta. Helados, risas y miradas que decían más que mil palabras.',

      '<p>Este recuerdo quedó grabado en mi corazón.</p><img src="Foto-recuerdo.jpeg">',

      'Gracias por apoyarme, por no juzgarme y por quedarte incluso cuando no fue fácil.',

      '<strong>Te amo por ser tú misma, KATHERINE LISSETH NIETO ALVAREZ, porque te convertiste en la razón de mis alegrías ❤️</strong>',

      '<h2>¿Quieres seguir escribiendo esta historia conmigo?</h2>'
    ];

    /* ---------- FUNCIÓN BOTÓN ---------- */
    function avanzar(){
      // Inicia música en el primer click
      if(!musicaIniciada){
        musica.play().catch(()=>{});
        musicaIniciada = true;
      }

      if(paso >= momentos.length) return;

      const contenedor = document.getElementById('historia');
      contenedor.innerHTML = ''; // BORRA LO ANTERIOR

      const div = document.createElement('div');
      div.className = 'event';
      div.innerHTML = momentos[paso];
      contenedor.appendChild(div);

      paso++;

      if(paso === momentos.length){
        document.getElementById('btn').style.display = 'none';

        const opciones = document.createElement('div');
        opciones.style.textAlign = 'center';
        opciones.style.marginTop = '40px';

        opciones.innerHTML = `
          <button onclick="respuestaSi()" style="margin:15px;padding:15px 35px;border:none;border-radius:30px;background:#ff4f81;color:white;font-size:1.1rem;cursor:pointer;">💖 Me quedo</button>
          <button onclick="respuestaNo()" style="margin:15px;padding:15px 35px;border:none;border-radius:30px;background:#aaa;color:white;font-size:1.1rem;cursor:pointer;">💔 Me voy</button>
        `;

        contenedor.appendChild(opciones);
      }
    }

      if(paso >= momentos.length) return;

      const div = document.createElement('div');
      div.className = 'event';
      div.innerHTML = momentos[paso];
      document.getElementById('historia').appendChild(div);

      paso++;

      if(paso === momentos.length){
        document.getElementById('btn').innerText = '❤️ Siempre contigo';
      }
    }

    /* ---------- CORAZONES FLOTANDO ---------- */
    setInterval(()=>{
      const h = document.createElement('div');
      h.className = 'heart';
      h.innerText = '💖';
      h.style.left = Math.random()*100 + 'vw';
      h.style.animationDuration = (4 + Math.random()*4) + 's';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),8000);
    },600);
  function respuestaSi(){
      document.body.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#ff9a9e,#fad0c4);color:white;text-align:center;padding:40px;"><h1 style="font-family:Great Vibes;font-size:4rem;">Gracias por quedarte 💖</h1><p style="font-size:1.3rem;max-width:600px;">Prometo amarte, cuidarte y seguir escribiendo esta historia contigo todos los días.</p></div>';
    }

    function respuestaNo(){
      document.body.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#333;color:white;text-align:center;padding:40px;"><h1>Siempre te amaré</h1><p>Gracias por todo lo vivido ❤️</p></div>';
    }

  </script>

</body>
</html>
