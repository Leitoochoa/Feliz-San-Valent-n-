<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Historia 💖</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow-x:hidden;
  text-align:center;
  color:#fff;
}

.contenedor{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(15px);
  padding:30px;
  border-radius:25px;
  max-width:500px;
  width:100%;
  box-shadow:0 10px 40px rgba(0,0,0,0.2);
  animation:fade 0.6s ease;
}

h2{margin-bottom:15px;}

p{line-height:1.6;}

button{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background:#ff4e80;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#ff1e63;
  transform:scale(1.05);
}

img{
  width:100%;
  border-radius:20px;
  margin-top:15px;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

/* Confeti */
.heart{
  position:fixed;
  top:-10px;
  font-size:18px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh);
    opacity:0;
  }
}
</style>
</head>
<body>

<div class="contenedor">
  <div id="contenido" class="card"></div>
</div>

<audio id="musica" src="Morat, Juanes-Besos en Guerra.mp3" loop></audio>

<!-- 🔥 FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCdHbE-XWj7NDtIU0N_v7GA-8MmxxDno1E",
  authDomain: "san-valentin-f4317.firebaseapp.com",
  databaseURL: "https://san-valentin-f4317-default-rtdb.firebaseio.com",
  projectId: "san-valentin-f4317",
  storageBucket: "san-valentin-f4317.firebasestorage.app",
  messagingSenderId: "461191914428",
  appId: "1:461191914428:web:626ac530df1b8f6360c1b9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.guardarRespuesta = function(respuesta){
  const respuestasRef = ref(db,"respuestasSanValentin");
  push(respuestasRef,{
    respuesta:respuesta,
    fecha:new Date().toISOString(),
    userAgent:navigator.userAgent
  });
};
</script>

<script>
const contenido=document.getElementById("contenido");
const musica=document.getElementById("musica");
musica.volume=0.4; // 🔊 regula volumen aquí (0 a 1)

let indiceHistoria=0;
let indiceRazon=0;

/* ===== HISTORIA ===== */
const historia = [

`<h1>Nuestra Historia 💖</h1>
<p>Mi amorcito, en este 14 de febrero quiero que recorras conmigo nuestra historia… paso a paso, con el corazón abierto y la memoria llena de todo lo que hemos sentido. Quiero volver al primer latido, a las miradas tímidas, a los abrazos que nos cambiaron la vida, y recordarte que, si pudiera elegir otra vez, volvería a empezar contigo mil veces más.</p>
<button onclick="siguiente()">Comenzar</button>`,

`<h2>El Primero de Muchos 🙈</h2>
<p>Quién diría que después de coincidir tanto tiempo sin conocernos, hoy estaría viviendo nuestro primer 14 de febrero agradeciendo que la vida decidiera presentarnos y convertir a una desconocida en mi lugar favorito.</p>
<button onclick="siguiente()">Siguiente</button>`,

`<h2>Septiembre 2025</h2>
<p>El BTP nos cruzó en el momento perfecto, y desde el primer día hubo algo en ti que se sintió distinto, como si mi corazón ya supiera que ibas a ser importante.</p>
<img src="primera-foto.jpeg">
<p>Aquí todavía no sabíamos todo lo que venía… pero mi corazón ya había empezado a elegirte. .</p>
<button onclick="siguiente()">Siguiente</button>`,

`<h2>Nuestra primera cita 🍨</h2>
<p>No hubo promesas ni etiquetas, solo helados derritiéndose y tu sonrisa frente a mí… y mi corazón entendiendo en silencio que eres todo lo que quiero en mi vida.</p>
<img src="Foto-recuerdo.jpeg">
<button onclick="siguiente()">Siguiente</button>`,

  `<h2>Un dia amargo😔</h2>
<p>Aquel día difícil, cuando todo parecía tambalear, me dijiste algo que se quedó para siempre en mí: La relación es de dos y no te voy a dejar.
En esa frase entendí que tu amor no era pasajero, que estabas dispuesta a quedarte y a luchar por nosotros incluso cuando dolía..</p>
<button onclick="siguiente()">Siguiente</button>`,

  
`<h2>1 de enero</h2>
<p style="text-align:center">
Me colé en tu casa como un ladrón de minutos para robarle al año nuestro primer abrazo.
Entre el miedo y las ganas de no soltarte, amanecimos estrenando calendario y nuestra historia.
</p>
<button onclick="siguiente()">Siguiente</button>`,

`<h2>Y entonces entendí algo…</h2>
<p>
Nuestra historia no se cuenta solo con fechas, sino con apoyo, valentía y amor real.
Por eso quiero darte razones por las que te amo.
</p>
<button onclick="mostrarRazones()">Ver razones</button>`
];
 
let iHistoria = 0;
let iRazon = 0;

/* ===== INTRO RAZONES ===== */
function mostrarIntroRazones(){
contenido.innerHTML=`
<h2>100 Razones Para Amarte 💕</h2>
<p>Porque lo nuestro no se explica… se siente.  
Y si tuviera que decir por qué te amo, necesitaría al menos 100 intentos.</p>
<button onclick="mostrarRazones()">Empezar 💖</button>`;
}

/* ===== 100 RAZONES EDITABLES ===== */
const razones = [

{titulo:"Razón 1 💕",texto:"Porque desde que llegaste, todo tiene más sentido."},
{titulo:"Razón 2 💖",texto:"Porque tu sonrisa puede cambiar mi día entero."},
{titulo:"Razón 3 💗",texto:"Porque me apoyas incluso cuando dudo de mí mismo."},

{
titulo:"Razón 100 ❤️",
texto:`
Por ser tú misma, KATHERINE LISSETH NIETO ALVAREZ,
la razón de mis alegrías, mi paz y el amor que quiero para toda mi vida.

<br><br>

<img src="Mi-preciosa.jpeg">
`
}

];
/* ===== FUNCIONES ===== */
function siguiente(){
if(musica.paused) musica.play();
indiceHistoria++;
contenido.innerHTML=historia[indiceHistoria];
}

function mostrarRazones(){
indiceRazon=0;
renderRazon();
}

function siguienteRazon(){
indiceRazon++;
if(indiceRazon<razones.length){
  renderRazon();
}else{
  mostrarDecision();
}
}

function renderRazon(){
let r=razones[indiceRazon];
contenido.innerHTML=`
<h2>${r.titulo}</h2>
<p>${r.texto}</p>
${r.foto?`<img src="${r.foto}">`:""}
<button onclick="siguienteRazon()">Siguiente</button>`;
}

/* ===== DECISIÓN FINAL ===== */
function mostrarDecision(){
contenido.innerHTML=`
<h2>¿Quieres seguir escribiendo esta historia conmigo? 💕</h2>
<button onclick="respuesta('Se queda ❤️')">Me quedo</button>
<button onclick="respuesta('Se va 💔')">Me voy</button>`;
}

function respuesta(valor){
guardarRespuesta(valor);

if(valor==="Se queda ❤️"){
contenido.innerHTML=`
<h2>Sabía que dirías que sí 💖</h2>
<p>Prometo seguir construyendo contigo una historia que ni el tiempo pueda borrar.</p>`;
}else{
contenido.innerHTML=`
<h2>Siempre te voy a amar 💔</h2>
<p>Gracias por cada momento, cada risa y cada recuerdo que guardo en mi corazón.</p>`;
}
}

/* ===== CONFETI OPTIMIZADO ===== */
function crearCorazon(){
const heart=document.createElement("div");
heart.className="heart";
heart.innerText="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(Math.random()*3+4)+"s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),7000);
}

setInterval(crearCorazon,800); // velocidad controlada

contenido.innerHTML=historia[0];
</script>

</body>
</html>
