<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz 14 de Febrero ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#ff758c,#ff7eb3);
  color:#333;
  overflow-x:hidden;
}
header{
  text-align:center;
  padding:80px 20px;
  color:white;
}
header h1{
  font-family:'Great Vibes',cursive;
  font-size:3.8rem;
}
.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}
.event{
  background:white;
  border-radius:20px;
  padding:30px;
  margin:40px 0;
  box-shadow:0 15px 30px rgba(0,0,0,.2);
  animation:fade .8s ease;
}
.event img{
  width:100%;
  border-radius:15px;
  margin-top:20px;
}
button{
  display:block;
  margin:40px auto;
  padding:15px 40px;
  border:none;
  border-radius:30px;
  background:#ff4f81;
  color:white;
  font-size:1.1rem;
  cursor:pointer;
}
.heart{
  position:fixed;
  bottom:-20px;
  font-size:20px;
  animation:float 6s linear infinite;
  opacity:.8;
}
@keyframes float{
  from{transform:translateY(0);opacity:.8}
  to{transform:translateY(-120vh);opacity:0}
}
@keyframes fade{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<!-- AUDIO -->
<audio id="musica" preload="auto">
  <source src="Morat, Juanes-Besos en Guerra.mp3" type="audio/mpeg">
</audio>

<header>
  <h1>Feliz 14 de Febrero ❤️</h1>
  <p>Una historia escrita con amor, solo para ti</p>
</header>

<div class="container" id="historia"></div>

<button id="btn" onclick="avanzar()">💖 Comenzar nuestra historia</button>

<script>
const musica = document.getElementById('musica');
let iniciado = false;
let paso = 0;

const momentos = [
  'Esta página no es solo un regalo… es una parte de mi corazón hecha palabras, pensada para ti en este 14 de febrero ❤️',

  'Durante tres años caminamos por los mismos pasillos, compartimos el mismo colegio, sin hablarnos jamás. Y aun así, el destino ya estaba escribiendo nuestra historia en silencio.',

  'En septiembre de 2025 todo cambió. Entramos al BTP y empezamos a hablar. Desde el primer día sentí una conexión distinta, una química que no se puede explicar, solo sentir.',

  '<p>Esta foto guarda el inicio de algo hermoso. Cada vez que la veo recuerdo cómo empezó todo.</p><img src="primera-foto.jpeg">',

  'Nuestra primera cita fue sencilla, pero perfecta. Helados, risas, miradas largas y la certeza de que quería seguir conociéndote cada día más.',

  '<p>Este momento quedó grabado en mi memoria para siempre.</p><img src="Foto-recuerdo.jpeg">',

  'Gracias por apoyarme cuando más lo necesitaba, por escucharme sin juzgarme, por tomar mi pasado y ayudarme a transformarlo en fuerza. Gracias por quedarte.',

  '<strong>Te amo por ser tú misma, KATHERINE LISSETH NIETO ALVAREZ, porque con tu forma de ser te convertiste en la razón de mis alegrías, mi calma y mi hogar ❤️</strong>',

  '<h2>¿Quieres seguir escribiendo esta historia conmigo?</h2><p>Hoy, mañana y todos los días.</p>'
];

function avanzar(){
  // INICIO FORZADO DE MUSICA (funciona en GitHub Pages)
  if(!iniciado){
    musica.volume = 1;
    musica.play().catch(()=>{});
    iniciado = true;
  }

  if(paso >= momentos.length) return;

  const div = document.createElement('div');
  div.className = 'event';
  div.innerHTML = momentos[paso];
  document.getElementById('historia').appendChild(div);

  paso++;
  if(paso === momentos.length){
    document.getElementById('btn').innerText = '❤️ Siempre contigo';
  }
}

// Corazones flotando
setInterval(()=>{
  const h = document.createElement('div');
  h.className = 'heart';
  h.innerText = '💖';
  h.style.left = Math.random()*100+'vw';
  h.style.animationDuration = (4+Math.random()*4)+'s';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),8000);
},600);
</script>

</body>
</html>
