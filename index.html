<!DOCTYPE html>
<html lang="es">
<head>
  <!-- ================= CONFIGURACIÓN GENERAL ================= -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Historia 💖</title>

  <!-- ================= FUENTES ================= -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- ================= ESTILOS ================= -->
  <style>
    /* ===== ESTILO GENERAL ===== */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #ff9a9e, #fad0c4);
      min-height: 100vh;
      overflow-y: auto; /* IMPORTANTE: permite deslizar en celular */
    }

    /* ===== CONTENEDOR ===== */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    /* ===== TARJETA ===== */
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      box-shadow: 0 25px 50px rgba(255, 105, 135, 0.35);
      padding: 45px 35px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: aparecer 0.8s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    h1, h2 {
      font-family: 'Great Vibes', cursive;
      color: #ff4f81;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.7;
      margin: 18px 0;
    }

    img {
      width: 100%;
      border-radius: 18px;
      margin-top: 15px;
    }

    /* ===== BOTONES ===== */
    button {
      margin-top: 25px;
      padding: 14px 36px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(135deg, #ff4f81, #ff85a2);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 79, 129, 0.45);
    }

    button:hover {
      transform: scale(1.05);
    }

    /* ===== CONFETI DE CORAZONES ===== */
    .heart {
      position: fixed;
      top: -10px;
      font-size: 22px;
      animation: caer linear forwards;
      pointer-events: none;
    }

    @keyframes caer {
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .card {
        padding: 35px 25px;
      }
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

<!-- ================= AUDIO ================= -->
<audio id="musica" loop>
  <source src="Morat, Juanes-Besos en Guerra.mp3" type="audio/mpeg">
</audio>

<!-- ================= CONTENIDO ================= -->
<div class="container">
  <div class="card" id="contenido"></div>
</div>

<!-- ================= JAVASCRIPT ================= -->
<script>
  const musica = document.getElementById('musica');
  const contenido = document.getElementById('contenido');

  /* ===== HISTORIA (ORDENADA Y EDITABLE) ===== */
  const historia = [
    `<h1>Nuestra Historia 💖</h1>

     <button onclick="siguiente()">Comenzar</button>`,

    `<h2>Antes de conocernos</h2>

    `<h2>Septiembre 2025</h2>

    `<h2>Nuestra primera cita 🍨</h2>

    `<h2>1 de enero</h2>

  ];

  /* ===== 100 RAZONES ===== */
const razones =[

  { "titulo": "Razón 11", "texto": "Por cómo me cuidas cuando me siento mal." },

  { "titulo": "Razón 74", "texto": "Por tus imperfecciones, que te hacen perfecto/a para mí." },

  { "titulo": "Razón 100", "texto": "Porque simplemente eres tú, y eso es más que suficiente." }

];;

  let indiceHistoria = 0;
  let indiceRazon = 0;

  function iniciar() {
    contenido.innerHTML = historia[0];
  }

  function siguiente() {
    if (musica.paused) musica.play();
    indiceHistoria++;
    contenido.innerHTML = historia[indiceHistoria];
    lanzarCorazones();
  }

  function mostrarRazones() {
    indiceRazon = 0;
    contenido.innerHTML = razones[0];
    lanzarCorazones();
  }

  function siguienteRazon() {
    indiceRazon++;
    if (indiceRazon < razones.length) {
      contenido.innerHTML = razones[indiceRazon];
      lanzarCorazones();
    } else {
      contenido.innerHTML = `
        <h2>¿Quieres seguir escribiendo esta historia conmigo? 💕</h2>
        <button>Me quedo</button>
        <button>Me voy</button>
      `;
      lanzarCorazones();
    }
  }

  /* ===== CONFETI ===== */
  function lanzarCorazones() {
    for (let i = 0; i < 10; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerText = '💖';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
  }

  iniciar();
</script>

</body>
</html>
