.barra {

  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}
  .boton-amor {
  padding: 12px 28px;

  font-size: 16px;
  font-weight: bold;

  color: white;

  transition: all 0.3s ease;
}

.boton-amor:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(255, 78, 138, 0.6);
}

.boton-amor:active {
  transform: scale(0.95);
}

button:hover{
  background:#ff1e63;
  transform:scale(1.05);
}

img{
  width:100%;
  border-radius:20px;
  margin-top:15px;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

/* Confeti */
.heart{
  position:fixed;
  top:-10px;
  font-size:18px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh);
    opacity:0;
  }
}
  /* 💓 Latido suave */
.latido {
  animation: latido 1s infinite;
}

@keyframes latido {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }

 function escribirNombre(){
  const nombre = "KATHERINE LISSETH NIETO ALVAREZ";
  let i = 0;
  const span = document.getElementById("nombreMagico");
  
  if(!span) return;

  span.innerHTML = "";
  
  const intervalo = setInterval(()=>{
    span.innerHTML += nombre[i];
    i++;
    if(i >= nombre.length){
      clearInterval(intervalo);
      span.classList.add("brillo");
    }
  },80);
}

function crearCorazon(){
const heart=document.createElement("div");
heart.className="heart";
heart.innerText="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(Math.random()*3+4)+"s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),7000);
}
setInterval(crearCorazon,800); // velocidad controlada
contenido.innerHTML=historia[0];
actualizarProgreso();

function cambiarFondo(){

  if(indiceRazon<=25)
    document.body.style.background="linear-gradient(135deg,#ff9a9e,#fad0c4)";
  
  else if(indiceRazon<=50)
    document.body.style.background="linear-gradient(135deg,#a18cd1,#fbc2eb)";
  
  else if(indiceRazon<=75)
    document.body.style.background="linear-gradient(135deg,#ff758c,#ff7eb3)";
  
  else if(indiceRazon<=98)
    document.body.style.background="linear-gradient(135deg,#f6d365,#fda085)";
  
  else if(indiceRazon===99) // Razón 100
    document.body.style.background="linear-gradient(135deg,#fbc2eb,#a6c1ee)";
  
  else if(indiceRazon===100) // Razón 101
    document.body.style.background="linear-gradient(135deg,#141e30,#243b55)";
  
  else // Promesa
    document.body.style.background="linear-gradient(135deg,#ff758c,#ff7eb3)";
}
