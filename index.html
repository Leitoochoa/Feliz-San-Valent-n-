<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Historia 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#ff9a9e,#fad0c4);
  min-height:100vh;
  overflow-y:auto;
}

.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.95);
  border-radius:30px;
  box-shadow:0 25px 50px rgba(255,105,135,.35);
  padding:40px 30px;
  max-width:420px;
  width:100%;
  text-align:center;
  animation:fade .6s ease;
}

@keyframes fade{
  from{opacity:0;transform:scale(.95)}
  to{opacity:1;transform:scale(1)}
}

h1,h2{
  font-family:'Great Vibes',cursive;
  color:#ff4f81;
}

p{
  line-height:1.7;
  margin:18px 0;
}

img{
  width:100%;
  border-radius:20px;
  margin-top:15px;
}

button{
  margin-top:25px;
  padding:14px 36px;
  border:none;
  border-radius:40px;
  background:linear-gradient(135deg,#ff4f81,#ff85a2);
  color:white;
  font-size:1rem;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(255,79,129,.45);
}

.heart{
  position:fixed;
  top:-20px;
  font-size:22px;
  animation:caer linear forwards;
  pointer-events:none;
}

@keyframes caer{
  to{transform:translateY(110vh);opacity:0}
}
</style>
</head>

<body>

<audio id="musica" loop>
  <source src="Morat, Juanes-Besos en Guerra.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <div class="card" id="contenido"></div>
</div>

<script>
const musica = document.getElementById("musica");
const contenido = document.getElementById("contenido");

/* ===== HISTORIA ===== */
const historia = [
`<h1>Nuestra Historia 💖</h1>
<p>Mi amor este 14 de febrero quiero que recorras conmigo nuestra historia… paso a paso, con el corazón abierto.</p>
<button onclick="siguiente()">Comenzar</button>`,

`<h2>Antes de conocernos</h2>
<p>Tres años compartiendo los mismos pasillos, respirando el mismo aire, cruzándonos sin saberlo… sin imaginarnos que el destino, paciente y silencioso, ya estaba escribiendo nuestra historia.</p>
<button onclick="siguiente()">Siguiente</button>`,

`<h2>Septiembre 2025</h2>
<p>El BTP nos juntó. Desde el primer día sentí una conexión distinta contigo.</p>
<img src="primera-foto.jpeg">
<p>El amor ya había empezado; esta foto solo lo delató.</p>
<button onclick="siguiente()">Siguiente</button>`,

`<h2>Nuestra primera cita 🍨</h2>
<p>Unos helados, risas sinceras y la certeza de que me estabas conquistando sin esfuerzo.</p>
<img src="Foto-recuerdo.jpeg">
<button onclick="siguiente()">Siguiente</button>`,

`<h2>1 de enero</h2>
<p style="text-align:center">
Me colé en tu casa como un ladrón de minutos para robarle al año nuestro primer abrazo.
Entre el miedo y las ganas de no soltarte, amanecimos estrenando calendario y nuestra historia.
</p>
<button onclick="mostrarRazones()">Continuar</button>`,

`<h2>Y entonces entendí algo…</h2>
<p>
Nuestra historia no se hizo de fechas, sino de apoyo, valentía y amor real.
Y por eso quiero darte 100 razones por las que te amo.
</p>
<button onclick="mostrarRazones()">Ver razones</button>`
];

let iHistoria = 0;
let iRazon = 0;

/* ===== 100 RAZONES (EDITA AQUÍ) ===== */
const razones = [
{titulo:"Razón 1 💕",texto:"Porque desde que llegaste, todo empezó a tener sentido."},
{titulo:"Razón 2 💖",texto:"Porque haces hogar incluso en los días difíciles."},
{titulo:"Razón 3 💗",texto:"Porque me eliges incluso cuando no es fácil."},

{titulo:"Razón 100 ❤️",texto:"Por ser tú misma, KATHERINE LISSETH NIETO ALVAREZ, la razón de mis alegrías, mi paz y el amor de mi vida."}
];

/* ===== FUNCIONES ===== */
function iniciar(){
  
  contenido.innerHTML = historia[0];
}

function siguiente(){
  if(musica.paused) musica.play();
  iHistoria++;
  contenido.innerHTML = historia[iHistoria];
  corazones();
}

function mostrarRazones(){
  iRazon = 0;
  mostrarRazon();
}

function mostrarRazon(){
  const r = razones[iRazon];
  contenido.innerHTML = `
    <h2>${r.titulo}</h2>
    <p>${r.texto}</p>
    <button onclick="siguienteRazon()">Siguiente</button>
  `;
  corazones();
}

function siguienteRazon(){
  iRazon++;
  if(iRazon < razones.length){
    mostrarRazon();
  }else{
    contenido.innerHTML = `
      <h2>¿Quieres seguir escribiendo esta historia conmigo? 💕</h2>
      <button onclick="respuesta(true)">Me quedo 💖</button>
      <button onclick="respuesta(false)">Me voy 💔</button>
    `;
  }
}

function respuesta(ok){
  contenido.innerHTML = ok
    ? "<h2>Gracias por quedarte 💖</h2><p>Prometo escribir esta historia contigo todos los días.</p>"
    : "<h2>Gracias por lo vivido 💔</h2><p>Siempre llevaré lo nuestro en el corazón.</p>";
}

/* ===== CORAZONES ===== */
function corazones(){
  /* ===== CORAZONES ===== */
setInterval(() => {
  for(let i=0;i<3;i++){
    corazones();
  }
}, 1200);
  /* ===== CORAZONES ===== */
  for(let i=0;i<8;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerText="💖";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration="4s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),4000);
  }
}

iniciar();
</script>

</body>
</html>
