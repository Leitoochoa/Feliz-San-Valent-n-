<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Historia 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#ff9a9e,#fad0c4);
  min-height:100vh;
  overflow-x:hidden;
}

.container{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(10px);
  border-radius:30px;
  box-shadow:0 20px 40px rgba(255,105,135,0.35);
  padding:40px 30px;
  max-width:420px;
  width:100%;
  text-align:center;
  animation:fade 0.6s ease;
}

@keyframes fade{
  from{opacity:0;transform:scale(.95);}
  to{opacity:1;transform:scale(1);}
}

h1,h2{
  font-family:'Great Vibes',cursive;
  color:#ff4f81;
}

p{
  line-height:1.6;
}

img{
  width:100%;
  border-radius:15px;
  margin-top:15px;
}

button{
  margin-top:20px;
  padding:12px 28px;
  border:none;
  border-radius:30px;
  background:linear-gradient(135deg,#ff4f81,#ff85a2);
  color:white;
  font-size:1rem;
  cursor:pointer;
}

button:hover{
  transform:scale(1.05);
}

/* corazones */
.heart{
  position:fixed;
  top:-20px;
  font-size:20px;
  animation:fall linear forwards;
  pointer-events:none;
}

@keyframes fall{
  to{
    transform:translateY(110vh);
    opacity:0;
  }
}

@media(max-width:480px){
  .card{padding:30px 20px;}
}
</style>
</head>

<body>

<audio id="musica" loop>
  <source src="Morat, Juanes-Besos en Guerra.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <div class="card" id="contenido"></div>
</div>

<script>
const musica=document.getElementById("musica");
musica.volume=0.4; // 🔊 regula volumen aquí (0 a 1)

const contenido=document.getElementById("contenido");

/* ================= HISTORIA ================= */
const historia=[

`<h1>Nuestra Historia 💖</h1>
<p>Mi amorcito, en este 14 de febrero quiero que recorras conmigo nuestra historia… paso a paso, con el corazón abierto y la memoria llena de todo lo que hemos sentido. Quiero volver al primer latido, a las miradas tímidas, a los abrazos que nos cambiaron la vida, y recordarte que, si pudiera elegir otra vez, volvería a empezar contigo mil veces más.</p>
<button onclick="siguiente()">Comenzar</button>`,

`<h2>El Primero de Muchos 🙈</h2>
<p>Quién diría que después de coincidir tanto tiempo sin conocernos, hoy estaría viviendo nuestro primer 14 de febrero agradeciendo que la vida decidiera presentarnos y convertir a una desconocida en mi lugar favorito.</p>
<button onclick="siguiente()">Siguiente</button>`,

`<h2>Septiembre 2025</h2>
<p>El BTP nos cruzó en el momento perfecto, y desde el primer día hubo algo en ti que se sintió distinto, como si mi corazón ya supiera que ibas a ser importante.</p>
<img src="primera-foto.jpeg">
<p>Aquí todavía no sabíamos todo lo que venía… pero mi corazón ya había empezado a elegirte. .</p>
<button onclick="siguiente()">Siguiente</button>`,

`<h2>Nuestra primera cita 🍨</h2>
<p>No hubo promesas ni etiquetas, solo helados derritiéndose y tu sonrisa frente a mí… y mi corazón entendiendo en silencio que eres todo lo que quiero en mi vida.</p>
<img src="Foto-recuerdo.jpeg">
<button onclick="siguiente()">Siguiente</button>`,

  `<h2>Un dia amargo😔</h2>
<p>Aquel día difícil, cuando todo parecía tambalear, me dijiste algo que se quedó para siempre en mí: La relación es de dos y no te voy a dejar.
En esa frase entendí que tu amor no era pasajero, que estabas dispuesta a quedarte y a luchar por nosotros incluso cuando dolía..</p>
<button onclick="siguiente()">Siguiente</button>`,

  
`<h2>1 de enero</h2>
<p style="text-align:center">
Me colé en tu casa como un ladrón de minutos para robarle al año nuestro primer abrazo.
Entre el miedo y las ganas de no soltarte, amanecimos estrenando calendario y nuestra historia.
</p>
<button onclick="siguiente()">Siguiente</button>`,

`<h2>Y entonces entendí algo…</h2>
<p>
Nuestra historia no se cuenta solo con fechas, sino con apoyo, valentía y amor real.
Por eso quiero darte razones por las que te amo.
</p>
<button onclick="mostrarRazones()">Ver razones</button>`
];

let indiceHistoria=0;
let indiceRazon=0;

/* ================= 100 RAZONES ================= */
const razones=[
{titulo:"Razón 1 💖",texto:"Porque iluminas mi vida incluso en mis días más grises."},
{titulo:"Razón 2 💕",texto:"Porque tu sonrisa puede cambiar mi mundo entero."},
{titulo:"Razón  😘",texto:"."},
/* ✍️ AGREGA AQUÍ TODAS TUS RAZONES PERSONALIZADAS */

{titulo:"Razón 100 ❤️",
texto:"Por ser tú misma, KATHERINE LISSETH NIETO ALVAREZ, la mujer que quiero en mi futuro.",
imagen:"Mi-preciosa.jpeg"}
];

/* ================= FUNCIONES ================= */

function siguiente(){
  if(musica.paused) musica.play();
  indiceHistoria++;
  contenido.innerHTML=historia[indiceHistoria];
}

function mostrarRazones(){
  indiceRazon=0;
  mostrarRazonActual();
}

function mostrarRazonActual(){
  const r=razones[indiceRazon];

  contenido.innerHTML=`
  <h2>${r.titulo}</h2>
  <p>${r.texto}</p>
  ${r.imagen ? `<img src="${r.imagen}">` : ""}
  <button onclick="siguienteRazon()">
  ${indiceRazon===razones.length-1?"Final 💖":"Siguiente ➜"}
  </button>
  `;
}

function siguienteRazon(){
  indiceRazon++;
  if(indiceRazon<razones.length){
    mostrarRazonActual();
  }else{
    contenido.innerHTML=`
    <h2>¿Quieres seguir escribiendo esta historia conmigo? 💕</h2>
    <button onclick="respuesta('queda')">Me quedo 💖</button>
    <button onclick="respuesta('va')">Me voy 💔</button>
    `;
  }
}

/* ================= WHATSAPP ================= */

function respuesta(opcion){
  let mensaje=opcion==="queda"
  ?"Elegí quedarme contigo 💖"
  :"Elegí irme 💔";

  const numero="+593 939919644"; // ⚠️ PON TU NÚMERO
  const url=`https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
  window.open(url,"_blank");
}

/* ================= CONFETI SUAVE CONSTANTE ================= */

function crearCorazon(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="💗";
  heart.style.left=Math.random()*100+"vw";
  heart.style.animationDuration=(Math.random()*3+4)+"s";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),7000);
}

// cae uno cada 800ms (no satura)
setInterval(crearCorazon,800);

/* ================= INICIAR ================= */
contenido.innerHTML=historia[0];

</script>

</body>
</html>
