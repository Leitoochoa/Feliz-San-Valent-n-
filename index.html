<!DOCTYPE html>
<html lang="es">
<head>
  <!-- ================= CONFIGURACIÓN GENERAL ================= -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Historia 💖</title>

  <!-- ================= FUENTES ================= -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- ================= ESTILOS ================= -->
  <style>
    /* ===== ESTILO GENERAL ===== */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #ff9a9e, #fad0c4);
      min-height: 100vh;
      overflow-y: auto; /* IMPORTANTE: permite deslizar en celular */
    }

    /* ===== CONTENEDOR ===== */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    /* ===== TARJETA ===== */
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      box-shadow: 0 25px 50px rgba(255, 105, 135, 0.35);
      padding: 45px 35px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: aparecer 0.8s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    h1, h2 {
      font-family: 'Great Vibes', cursive;
      color: #ff4f81;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.7;
      margin: 18px 0;
    }

    img {
      width: 100%;
      border-radius: 18px;
      margin-top: 15px;
    }

    /* ===== BOTONES ===== */
    button {
      margin-top: 25px;
      padding: 14px 36px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(135deg, #ff4f81, #ff85a2);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 79, 129, 0.45);
    }

    button:hover {
      transform: scale(1.05);
    }

    /* ===== CONFETI DE CORAZONES ===== */
    .heart {
      position: fixed;
      top: -10px;
      font-size: 22px;
      animation: caer linear forwards;
      pointer-events: none;
    }

    @keyframes caer {
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .card {
        padding: 35px 25px;
      }
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

<!-- ================= AUDIO ================= -->
<audio id="musica" loop>
  <source src="Morat, Juanes-Besos en Guerra.mp3" type="audio/mpeg">
</audio>

<!-- ================= CONTENIDO ================= -->
<div class="container">
  <div class="card" id="contenido"></div>
</div>

<div id="contenido"></div>

<script>
/* =========================
   RAZONES POR LAS QUE TE AMO
   (EDITA AQUÍ CADA RAZÓN)
   ========================= */

const razones = [
  {
    titulo: "Razón 1 💕",
    texto: "Porque desde que llegaste a mi vida, todo empezó a tener más sentido."
  },
  {
    titulo: "Razón 2 💖",
    texto: "Porque incluso en mis días más grises, tú encuentras la forma de hacerme sonreír."
  },
  {
    titulo: "Razón 3 💗",
    texto: "Porque me escuchas sin juzgar y me abrazas cuando más lo necesito."
  },

  /* 👉 AGREGA AQUÍ TUS RAZONES UNA POR UNA 👈 */

  {
    titulo: "Razón 100 ❤️",
    texto: "Por ser tú misma, KATHERINE LISSETH NIETO ALVAREZ, la razón de mis alegrías, de mi paz y de cada uno de mis sueños."
  }
];

let indiceRazon = 0;
const contenido = document.getElementById("contenido");

/* =========================
   MOSTRAR RAZÓN ACTUAL
   ========================= */
function mostrarRazonActual() {
  const razon = razones[indiceRazon];

  contenido.innerHTML = `
    <div class="tarjeta-razon">
      <h2>${razon.titulo}</h2>
      <p>${razon.texto}</p>
      <button onclick="siguienteRazon()">
        ${indiceRazon === razones.length - 1 ? "Final 💕" : "Siguiente ➜"}
      </button>
    </div>
  `;

  lanzarCorazones();
}

/* =========================
   INICIAR RAZONES
   ========================= */
function mostrarRazones() {
  indiceRazon = 0;
  mostrarRazonActual();
}

/* =========================
   SIGUIENTE RAZÓN
   ========================= */
function siguienteRazon() {
  indiceRazon++;

  if (indiceRazon < razones.length) {
    mostrarRazonActual();
  } else {
    contenido.innerHTML = `
      <div class="tarjeta-razon">
        <h2>¿Quieres seguir escribiendo esta historia conmigo? 💕</h2>
        <div class="botones-final">
          <button onclick="respuesta('queda')">Me quedo 💖</button>
          <button onclick="respuesta('va')">Me voy 💔</button>
        </div>
      </div>
    `;
    lanzarCorazones();
  }
}

/* =========================
   RESPUESTA FINAL
   ========================= */
function respuesta(opcion) {
  if (opcion === "queda") {
    contenido.innerHTML = `
      <div class="tarjeta-razon">
        <h2>Gracias por quedarte 💖</h2>
        <p>Prometo seguir escribiendo esta historia contigo, todos los días.</p>
      </div>
    `;
  } else {
    contenido.innerHTML = `
      <div class="tarjeta-razon">
        <h2>Gracias por haber llegado a mi vida 💔</h2>
        <p>Aunque duela, siempre llevaré lo nuestro en el corazón.</p>
      </div>
    `;
  }
  lanzarCorazones();
}

/* =========================
   CONFETI DE CORAZONES
   ========================= */
function lanzarCorazones() {
  const corazon = document.createElement("div");
  corazon.innerHTML = "💕";
  corazon.style.position = "fixed";
  corazon.style.left = Math.random() * 100 + "vw";
  corazon.style.top = "-20px";
  corazon.style.fontSize = "24px";
  corazon.style.animation = "caer 4s linear";
  document.body.appendChild(corazon);

  setTimeout(() => corazon.remove(), 4000);
}
</script>

<style>
/* =========================
   ESTILOS BÁSICOS
   ========================= */
.tarjeta-razon {
  background: rgba(255,255,255,0.9);

}

    opacity: 0;
  }
}
</style>
