<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Historia 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#ff9a9e,#fad0c4);
  min-height:100vh;
  overflow-x:hidden;
}

.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.95);
  border-radius:30px;
  box-shadow:0 25px 50px rgba(255,105,135,.35);
  padding:40px 30px;
  max-width:420px;
  width:100%;
  text-align:center;
  animation:fade .6s ease;
  position:relative;
  z-index:2;
}

@keyframes fade{
  from{opacity:0;transform:scale(.95)}
  to{opacity:1;transform:scale(1)}
}

h1,h2{
  font-family:'Great Vibes',cursive;
  color:#ff4f81;
}

p{
  line-height:1.7;
  margin:18px 0;
}

img{
  width:100%;
  border-radius:20px;
  margin-top:15px;
  box-shadow:0 10px 25px rgba(255,105,135,.3);
}

button{
  margin-top:25px;
  padding:14px 36px;
  border:none;
  border-radius:40px;
  background:linear-gradient(135deg,#ff4f81,#ff85a2);
  color:white;
  font-size:1rem;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(255,79,129,.45);
  transition:.2s;
}

button:hover{
  transform:scale(1.05);
}

/* ===== CORAZONES ===== */
.heart{
  position:fixed;
  top:-30px;
  pointer-events:none;
  z-index:1;
  opacity:0.85;
  animation:caer linear forwards;
}

@keyframes caer{
  0%{transform:translateY(0) rotate(0deg);}
  100%{transform:translateY(110vh) rotate(360deg);}
}
</style>
</head>

<body>

<audio id="musica" loop>
  <source src="Morat, Juanes-Besos en Guerra.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <div class="card" id="contenido"></div>
</div>

<script>
const musica = document.getElementById("musica");
const contenido = document.getElementById("contenido");

/* ===== HISTORIA ===== */
const historia = [

`<h1>Nuestra Historia 💖</h1>
<p>Mi amorcito, en este 14 de febrero quiero que recorras conmigo nuestra historia… paso a paso, con el corazón abierto y la memoria llena de todo lo que hemos sentido. Quiero volver al primer latido, a las miradas tímidas, a los abrazos que nos cambiaron la vida, y recordarte que, si pudiera elegir otra vez, volvería a empezar contigo mil veces más.</p>
<button onclick="siguiente()">Comenzar</button>`,

`<h2>El Primero de Muchos 🙈</h2>
<p>Quién diría que después de coincidir tanto tiempo sin conocernos, hoy estaría viviendo nuestro primer 14 de febrero agradeciendo que la vida decidiera presentarnos y convertir a una desconocida en mi lugar favorito.</p>
<button onclick="siguiente()">Siguiente</button>`,

`<h2>Septiembre 2025</h2>
<p>El BTP nos cruzó en el momento perfecto, y desde el primer día hubo algo en ti que se sintió distinto, como si mi corazón ya supiera que ibas a ser importante.</p>
<img src="primera-foto.jpeg">
<p>Aquí todavía no sabíamos todo lo que venía… pero mi corazón ya había empezado a elegirte. .</p>
<button onclick="siguiente()">Siguiente</button>`,

`<h2>Nuestra primera cita 🍨</h2>
<p>No hubo promesas ni etiquetas, solo helados derritiéndose y tu sonrisa frente a mí… y mi corazón entendiendo en silencio que eres todo lo que quiero en mi vida.</p>
<img src="Foto-recuerdo.jpeg">
<button onclick="siguiente()">Siguiente</button>`,

`<h2>Ese trago amargo 😔</h2>
<p>Ese dia del trago amargo, tu me dijiste una frase que jamas olvidare *LA RELACIÓN ES DE DOS Y NO TE VOY A DEJAR* esa frase se quedo inplantada en mi y me confirmo todo.</p>
<button onclick="siguiente()">Siguiente</button>`

`<h2>1 de enero</h2>
<p style="text-align:center">
Me colé en tu casa como un ladrón de minutos para robarle al año nuestro primer abrazo.
Entre el miedo y las ganas de no soltarte, amanecimos estrenando calendario y nuestra historia.
</p>
<button onclick="siguiente()">Siguiente</button>`,

`<h2>Y entonces entendí algo…</h2>
<p>
Nuestra historia no se cuenta solo con fechas, sino con apoyo, valentía y amor real.
Por eso quiero darte 100 razones por las que te amo.
</p>
<button onclick="mostrarRazones()">Ver razones</button>`
];

let iHistoria = 0;
let iRazon = 0;

/* ===== RAZONES ===== */
const razones = [

{titulo:"Razón 1 💕",texto:"Porque desde que llegaste, todo tiene más sentido."},
{titulo:"Razón 2 💖",texto:"Porque tu sonrisa puede cambiar mi día entero."},
{titulo:"Razón 3 💗",texto:"Porque me apoyas incluso cuando dudo de mí mismo."},

{
titulo:"Razón 100 ❤️",
texto:`
Por ser tú misma, KATHERINE LISSETH NIETO ALVAREZ,
la razón de mis alegrías, mi paz y el amor que quiero para toda mi vida.

<br><br>

<img src="Mi-preciosa.jpeg">
`
}

];

/* ===== FUNCIONES ===== */

function iniciar(){
  contenido.innerHTML = historia[0];
}

function siguiente(){
  if(musica.paused){
    musica.play().catch(()=>{});
  }
  iHistoria++;
  contenido.innerHTML = historia[iHistoria];
}

function mostrarRazones(){
  iRazon = 0;
  mostrarRazon();
}

function mostrarRazon(){
  const r = razones[iRazon];
  contenido.innerHTML = `
    <h2>${r.titulo}</h2>
    <p>${r.texto}</p>
    <button onclick="siguienteRazon()">Siguiente</button>
  `;
}

function siguienteRazon(){
  iRazon++;
  if(iRazon < razones.length){
    mostrarRazon();
  }else{
    contenido.innerHTML = `
      <h2>¿Quieres seguir escribiendo esta historia conmigo? 💕</h2>
      <button onclick="respuesta(true)">Me quedo 💖</button>
      <button onclick="respuesta(false)">Me voy 💔</button>
    `;
  }
}

function respuesta(ok){
  contenido.innerHTML = ok
  ? "<h2>Gracias por quedarte 💖</h2><p>Prometo escribir esta historia contigo todos los días.</p>"
  : "<h2>Siempre serás parte de mi historia 💔</h2><p>Gracias por lo vivido.</p>";
}

/* ===== CORAZONES SUAVES CONTINUOS ===== */

function crearCorazon(){
  const heart=document.createElement("div");
  heart.className="heart";

  const emojis=["💖","💕","💗","❤️"];
  heart.innerText=emojis[Math.floor(Math.random()*emojis.length)];

  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(Math.random()*18+14)+"px";
  heart.style.animationDuration=(Math.random()*4+4)+"s";

  document.body.appendChild(heart);

  setTimeout(()=>heart.remove(),8000);
}

setInterval(crearCorazon,500);

iniciar();
</script>

</body>
</html>
