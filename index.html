<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>14 de Febrero 💖 Nuestra Historia</title>

  <!-- ================== ESTILOS ================== -->
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #ff9a9e, #fad0c4);
      color: #333;
      overflow: hidden;
    }

    .container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 22px;
      max-width: 650px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      animation: fadeIn 0.8s ease;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #ff4f81;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.8;
    }

    button {
      margin-top: 30px;
      padding: 14px 34px;
      font-size: 1.05rem;
      border: none;
      border-radius: 30px;
      background: #ff4f81;
      color: white;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      background: #ff2f6d;
    }

    .heart {
      position: fixed;
      top: -20px;
      font-size: 20px;
      animation: fall 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes fall {
      from { transform: translateY(0); }
      to { transform: translateY(110vh); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================== MOBILE ================== */
    @media (max-width: 768px) {
      .card { padding: 25px; max-width: 95%; }
      h1 { font-size: 2.2rem; }
      p { font-size: 1rem; }
      button { width: 100%; padding: 14px; }
    }
  </style>
</head>
<body>

<!-- ================== MUSICA ================== -->
<audio id="musica" loop>
  <source src="Morat, Juanes-Besos en Guerra.mp3.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <div class="card" id="card">
    <h1>Nuestra Historia 💖</h1>
    <p>Este 14 de febrero quiero que recorras conmigo nuestra historia… paso a paso, con el corazón abierto.</p>
    <button onclick="iniciar()">Comenzar</button>
  </div>
</div>

<script>
  const musica = document.getElementById('musica');
  const card = document.getElementById('card');
  let indice = 0;

  const historia = [
    "Durante tres años estuvimos en el mismo colegio. Los mismos pasillos, las mismas clases… pero sin hablarnos nunca.",
    "En septiembre del 2025 entramos al BTP. Ahí empezó todo. Hablamos por primera vez y desde ese día hubo una química que no se podía negar.",
    "Empezamos a conversar, a reír, a conocernos. El interés fue mutuo desde el primer momento.",
    "Hubo verdades difíciles, pero en nuestro primer beso supe que te elegía a ti, que quería un futuro serio contigo.",
    "Nuestra primera cita fue sencilla: unos helados, risas y miradas que decían más que palabras.",
    "Hubo un día difícil, lágrimas y comentarios que dolieron. Pero dijiste algo que jamás olvidaré: que la relación es de dos y que ibas a luchar.",
    "Esperando el bus, sin planes, surgió la pregunta más importante… y nos hicimos novios.",
    "El 31 de diciembre me fui a dormir a tu casa y amanecimos juntos el 1 de enero, comenzando el año y nuestra historia oficialmente.",
    "Desde entonces has sido mi apoyo, mi paz, mi fuerza. Conoces mi pasado y nunca me juzgaste.",
    "Y hoy, aquí estamos… celebrando nuestro amor este 14 de febrero."
  ];

  const razones = Array.from({ length: 100 }, (_, i) => i + 1);

  function iniciar() {
    musica.play();
    mostrarHistoria();
  }

  function mostrarHistoria() {
    card.innerHTML = `
      <h1>Nuestra Historia 💕</h1>
      <p>${historia[indice]}</p>
      <button onclick="siguienteHistoria()">Siguiente</button>
    `;
  }

  function siguienteHistoria() {
    indice++;
    if (indice < historia.length) {
      mostrarHistoria();
    } else {
      indice = 0;
      mostrarRazon();
    }
  }

  function mostrarRazon() {
    card.innerHTML = `
      <h1>Razón ${indice + 1} 💖</h1>
      <p>${textoRazon(indice)}</p>
      <button onclick="siguienteRazon()">Siguiente</button>
    `;
  }

  function siguienteRazon() {
    indice++;
    if (indice < 100) {
      mostrarRazon();
    } else {
      final();
    }
  }

  function textoRazon(i) {
    if (i === 99) return "Porque por ser tú misma, KATHERINE LISSETH NIETO ALVAREZ, eres la razón de mis alegrías.";
    return `Porque contigo aprendí que el amor se construye con paciencia, verdad y ternura. (${i + 1})`;
  }

  function final() {
    card.innerHTML = `
      <h1>¿Quieres seguir escribiendo esta historia conmigo? 💍</h1>
      <button onclick="respuestaSi()">💖 Me quedo</button>
      <button onclick="respuestaNo()">💔 Me voy</button>
    `;
  }

  function respuestaSi() {
    card.innerHTML = '<h1>Gracias por quedarte 💖</h1><p>Prometo amarte, cuidarte y escribir contigo cada capítulo de nuestra historia.</p>';
  }

  function respuestaNo() {
    card.innerHTML = '<h1>Gracias por todo 💔</h1><p>Siempre llevaré lo nuestro en el corazón.</p>';
  }

  // Confeti de corazones
  setInterval(() => {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '💖';
    heart.style.left = Math.random() * 100 + 'vw';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }, 350);
</script>

</body>
</html>
