<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Ti ❤️</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    max-width: 360px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: fadeIn 1s ease;
  }

  h1 {
    color: #c2185b;
  }

  p {
    color: #555;
    font-size: 1.1em;
  }

  .btn {
    margin-top: 20px;
    padding: 12px 28px;
    background: #c2185b;
    color: white;
    border: none;
    border-radius: 999px;
    font-size: 1em;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 10px 25px rgba(194,24,91,.35);
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(194,24,91,.45);
  }

  .hidden {
    display: none;
  }

  .foto {
    width: 100%;
    border-radius: 15px;
    margin-top: 15px;
    animation: zoom 1s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes zoom {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="musica" src="musica.mp3"></audio>

<!-- CAPA INICIAL -->
<div class="card" id="inicio">
  <h1>Hola amor ❤️</h1>
  <p>
    Esto no es solo una página…  
    es un pedacito de lo que siento por ti.
  </p>
  <button class="btn" onclick="iniciar()">Descúbrelo 💖</button>
</div>

<!-- CAPA RECUERDO -->
<div class="card hidden" id="recuerdo">
  <h1>Nuestra primera cita 💑</h1>
  <img src="Foto-recuerdo.jpeg" alt="Nuestro recuerdo" class="foto">
  <p>
    Ese día no sabía que estaba empezando algo tan bonito…  
    pero hoy sé que elegirte fue lo mejor ❤️
  </p>
</div>

<script>
function iniciar() {
  document.getElementById("inicio").classList.add("hidden");
  document.getElementById("recuerdo").classList.remove("hidden");

  const musica = document.getElementById("Morat, Juanes-Besos en guerra.mp3");
  musica.volume = 0.6;
  musica.play();
}
</script>

</body>
</html>
